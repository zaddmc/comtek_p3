<h1 style="font-family: Verdana, Geneva, Tahoma, sans-serif;">Login to your account</h1>
<h2 style="font-family: Verdana, Geneva, Tahoma, sans-serif;">Log In</h2>
<form method="post">
    {{ form.non_field_errors }}
    <div class="fieldWrapper">
        {{ form.username.errors }}
        <label for="{{ form.username.id_for_label }}">Username:</label>
        {{ form.username }}
    </div>
    <div class="fieldWrapper">
        {{ form.password.errors }}
        <label for="{{ form.password.id_for_label }}">Password:</label>
        {{ form.password }}
    </div>
    
    
    <button type="submit">Login</button>
</form>
<h2 style="font-family: Verdana, Geneva, Tahoma, sans-serif;">No account?</h2>
<a href="/accounts/signup" style="font-family: Verdana, Geneva, Tahoma, sans-serif;">Sign up</a>

<style>
    /* From Uiverse.io by Praashoo7 */ 
  input{
    
    border: none;
    outline: none;

    transition: 300ms ease-in-out;
    
  }
  input:focus{
    background-color: white;

    box-shadow: 13px 13px 100px #969696,
              -13px -13px 100px #ffffff;

  }

</style>
