<h1 style="font-family: Verdana, Geneva, Tahoma, sans-serif;">Login to your account</h1>
<h2 style="font-family: Verdana, Geneva, Tahoma, sans-serif;">Log In</h2>
<form method="post">
  {% csrf_token %}
  {{ form }}
  <button type="submit" style="font-family: Verdana, Geneva, Tahoma, sans-serif;">Log In</button>
</form>
<h2 style="font-family: Verdana, Geneva, Tahoma, sans-serif;">No account?</h2>
<a href="/accounts/signup" style="font-family: Verdana, Geneva, Tahoma, sans-serif;">Sign up</a>
