<h1 style="margin-bottom: 1px" style="font-family: Verdana, Geneva, Tahoma, sans-serif;">Sign in</h1>
<h3 style="margin-top: 1px" style="font-family: Verdana, Geneva, Tahoma, sans-serif;">To continue to front page</h3>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}

    <div class="fieldWrapper">
      {{ form.username.errors }}
      <input 
        type="text" 
        name="{{ form.username.name }}" 
        id="{{ form.username.id_for_label }}" 
        placeholder="Username"
      />
    </div>

    <div class="fieldWrapper" style="margin-top: 7px">
      {{ form.password.errors }}
      <input 
        type="password" 
        name="{{ form.password.name }}" 
        id="{{ form.password.id_for_label }}" 
        placeholder="Password"
      />
    </div>

    <button type="submit" style="margin-top: 10px;">Sign In</button>
</form>

<h3 style="font-family: Verdana, Geneva, Tahoma, sans-serif;">Don't have an account?</h3>
<a href="/accounts/signup" style="font-family: Verdana, Geneva, Tahoma, sans-serif;">Sign up</a>

<style>
body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: sans-serif;
  line-height: 1.5;
  min-height: 100vh;
  background: #ffffff;
  flex-direction: column;
  margin: 0;
}


/* From Uiverse.io by Praashoo7 */ 
input{
  margin: 0 auto;
  border: none;
  outline: none;
  border-radius: 15px;
  padding: 1em;
  background-color: #ccc;
  box-shadow: inset 2px 5px 10px rgba(0,0,0,0.3);
  transition: 300ms ease-in-out;
  
}
input:focus{
  background-color: white;
  transform: scale(1.05);
  box-shadow: 13px 13px 100px #969696,
            -13px -13px 100px #ffffff;

}
/* From Uiverse.io by SpatexDEV */ 
button {
  margin: auto;
  border: none;
  display: flex;
  padding: 0.75rem 1.5rem;
  background-color: #488aec;
  color: #ffffff;
  font-size: 0.75rem;
  line-height: 1rem;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
  text-transform: uppercase;
  vertical-align: middle;
  align-items: center;
  border-radius: 0.5rem;
  user-select: none;
  gap: 0.75rem;
  box-shadow:
    0 4px 6px -1px #488aec31,
    0 2px 4px -1px #488aec17;
  transition: all 0.6s ease;
}

button:hover {
  box-shadow:
    0 10px 15px -3px #488aec4f,
    0 4px 6px -2px #488aec17;
}

button:focus,
button:active {
  opacity: 0.85;
  box-shadow: none;
}

button svg {
  width: 1.25rem;
  height: 1.25rem;
}

</style>
